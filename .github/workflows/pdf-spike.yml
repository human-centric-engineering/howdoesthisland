# TEMPORARY (t-31): measures what Chromium adds to the runtime image and how
# long a report PDF takes to render inside it. Removed before the PR merges;
# the numbers go in the PR description.
name: PDF spike (t-31, temporary)

on:
  push:
    branches: [feature/report-pdf]

permissions:
  contents: read

jobs:
  spike:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: docker/setup-buildx-action@v4

      - name: Build this branch's runtime image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: runner
          load: true
          tags: pdf-spike:branch
          build-args: |
            DATABASE_URL=postgresql://postgres:postgres@localhost:5432/sunrise
            BETTER_AUTH_URL=http://localhost:3000
            BETTER_AUTH_SECRET=ci-build-secret-not-for-production-use
            NEXT_PUBLIC_APP_URL=http://localhost:3000
            NODE_HEAP_MB=5120

      - name: Check out main for the size baseline
        run: git worktree add ../main origin/main

      - name: Build main's runtime image
        uses: docker/build-push-action@v7
        with:
          context: ../main
          target: runner
          load: true
          tags: pdf-spike:main
          build-args: |
            DATABASE_URL=postgresql://postgres:postgres@localhost:5432/sunrise
            BETTER_AUTH_URL=http://localhost:3000
            BETTER_AUTH_SECRET=ci-build-secret-not-for-production-use
            NEXT_PUBLIC_APP_URL=http://localhost:3000
            NODE_HEAP_MB=5120

      - name: Image sizes
        run: |
          for t in main branch; do
            docker image inspect "pdf-spike:$t" --format "$t {{.Size}} bytes"
          done
          docker run --rm pdf-spike:branch sh -c 'du -sh /usr/lib/chromium 2>/dev/null; ls node_modules | grep -i puppeteer'

      - name: Render the report fixture in the image
        run: |
          docker run --rm -v "$PWD/.spike:/spike:ro" pdf-spike:branch node /spike/run.cjs
