<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="HowDoesThisLand">
  <!-- The reader's eye, drawn with a broad nib and canted like a raised brow:
       its upper lid is the proofreader's insert caret, in the editor's red, and it
       glances up at that mark. How the copy lands, as an editor marks it. -->
  <rect width="64" height="64" rx="6" fill="#fdfdfb"/>
  <rect x="1" y="1" width="62" height="62" rx="5.5" fill="none" stroke="#d6d4cc" stroke-width="2"/>
  <g transform="rotate(-8 32 37)">
    <path d="M4 38 Q18 25 31 11 Q46 23 60 38 Q46 31.5 31.5 23 Q17 28.5 4 38 Z" fill="#d7263d"/>
    <path d="M4 38 Q38 67 60 38 Q30 53.5 4 38 Z" fill="#141414"/>
    <circle cx="32.5" cy="38.5" r="8.5" fill="#141414"/>
    <circle cx="35.6" cy="35.4" r="2.4" fill="#fdfdfb"/>
  </g>
</svg>
